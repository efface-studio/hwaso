name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U shop" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL_TEST: postgresql://shop:shop@localhost:5433/shop_test
      REDIS_URL: redis://localhost:6380
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # 핵심 흐름 E2E: API 빌드 → 마이그레이션·오프라인 시드 → API 기동 → 웹 빌드 → Playwright(웹 기동) → Chromium
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_e2e
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U shop" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      CI: 'true'
      # CI 전용 더미 값 (외부 연동 없음 — 결제는 모의 결제, 이미지는 오프라인 시드)
      DATABASE_URL: postgresql://shop:shop@localhost:5433/shop_e2e
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: e2e-secret-e2e-secret-e2e-secret-0000
      OTP_SECRET: e2e-otp-secret-e2e-otp-secret-00000000
      DATA_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      S3_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY: e2e-access
      S3_SECRET_KEY: e2e-secret-key
      MEDIA_PUBLIC_URL: http://localhost:9000/shop-media/public
      WEB_ORIGIN: http://localhost:3000
      SEED_OFFLINE: '1'
      # 시드는 기본 비밀번호로 최고 관리자를 만들지 않는다 — E2E 관리자 로그인용으로 명시 (fixtures.ts 의 PASSWORD 와 같게)
      SEED_ADMIN_PASSWORD: 'shop1234!'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # API 는 기동할 때 버킷을 확인·생성한다 — 로컬과 같은 S3 호환 저장소(RustFS)를 띄운다
      - name: Start S3 (RustFS)
        run: |
          docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY=$S3_ACCESS_KEY -e RUSTFS_SECRET_KEY=$S3_SECRET_KEY rustfs/rustfs:latest
          for i in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000)" != "000" ] && break; sleep 1; done

      # 웹 홈은 빌드 때 미리 렌더링되므로, API·시드를 먼저 올린 뒤 웹을 빌드한다
      - name: Build API
        run: pnpm --filter @shop/api... build

      - name: Migrate & seed
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec tsx prisma/seed.ts

      - name: Start API
        run: |
          node --enable-source-maps apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4000/api/v1/health > /dev/null && break; sleep 1; done
          curl -sf http://localhost:4000/api/v1/health

      - name: Build web
        run: pnpm --filter @shop/web... build

      - name: Install Chromium
        run: pnpm --filter @shop/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm --filter @shop/web e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            api.log
          retention-days: 7
